name: Build Desktop App

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: "Create a GitHub Release after build"
        required: true
        type: boolean
        default: true
      release_tag:
        description: "Optional manual release tag override (for example: 1.2 or 1.3.0)"
        required: false
        type: string
      release_name:
        description: "Optional release title override"
        required: false
        type: string
      prerelease:
        description: "Mark release as pre-release"
        required: true
        type: boolean
        default: false
      draft:
        description: "Create release as draft"
        required: true
        type: boolean
        default: false
      non_linux_assets_release_tag:
        description: "Existing release tag to reuse for Windows/macOS assets (defaults to latest published release)"
        required: false
        type: string

jobs:
  build_linux:
    name: Build Linux x64 .deb
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install Linux dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libx11-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libgtk-3-dev \
            libasound2-dev \
            libudev-dev \
            desktop-file-utils

      - name: Build release
        shell: bash
        run: cargo build --release --locked --target x86_64-unknown-linux-gnu

      - name: Test Linux Engine selection
        shell: bash
        run: cargo test --locked --target x86_64-unknown-linux-gnu

      - name: Build Ubuntu .deb package
        shell: bash
        run: |
          python3 scripts/build_linux_deb.py \
            --repo-root . \
            --binary "target/x86_64-unknown-linux-gnu/release/pdf_markdown_studio" \
            --output-dir dist

      - name: Normalize Ubuntu .deb filename
        shell: bash
        run: |
          set -euo pipefail
          deb_path="$(ls dist/*.deb | head -n 1)"
          cp "$deb_path" "dist/pdf-markdown-studio-ubuntu-amd64.deb"

      - name: Verify Ubuntu .deb identity and contents
        shell: bash
        run: |
          set -euo pipefail
          deb_path="dist/pdf-markdown-studio-ubuntu-amd64.deb"
          extract_root="$(mktemp -d)"
          trap 'rm -rf "$extract_root"' EXIT
          dpkg-deb -x "$deb_path" "$extract_root"

          DEB_PATH="$deb_path" EXTRACT_ROOT="$extract_root" python3 - <<'PY'
          import os
          import subprocess
          from pathlib import Path

          deb_path = Path(os.environ["DEB_PATH"])
          extract_root = Path(os.environ["EXTRACT_ROOT"])

          def field(name: str) -> str:
              return subprocess.check_output(
                  ["dpkg-deb", "--field", str(deb_path), name],
                  text=True,
              ).strip()

          assert field("Package") == "pdf-markdown-studio"
          assert field("Architecture") == "amd64"

          dependencies = [item.strip() for item in field("Depends").split(",")]
          assert "openresearchtools-engine" in dependencies
          assert "openresearchtools-engine-cuda" in dependencies

          desktop_path = extract_root / "usr/share/applications/pdf-markdown-studio.desktop"
          desktop_fields = {}
          for line in desktop_path.read_text(encoding="utf-8").splitlines():
              if "=" in line:
                  key, value = line.split("=", 1)
                  desktop_fields[key] = value

          assert desktop_fields["Name"] == "PDF Markdown Studio"
          assert desktop_fields["Exec"] == "pdf-markdown-studio %F"
          assert desktop_fields["Icon"] == "pdf-markdown-studio"
          assert desktop_fields["StartupWMClass"] == "pdf-markdown-studio"
          assert desktop_fields["Categories"] == "Office;Viewer;"
          assert desktop_fields["MimeType"] == (
              "application/pdf;image/png;image/jpeg;image/bmp;image/gif;"
              "image/webp;image/tiff;"
          )

          expected_files = {
              Path("opt/pdf-markdown-studio/pdf_markdown_studio"),
              Path("usr/bin/pdf-markdown-studio"),
              Path("usr/share/applications/pdf-markdown-studio.desktop"),
              Path("usr/share/icons/hicolor/512x512/apps/pdf-markdown-studio.png"),
          }
          packaged_files = {
              path.relative_to(extract_root)
              for path in extract_root.rglob("*")
              if path.is_file() or path.is_symlink()
          }
          assert packaged_files == expected_files, (
              "unexpected package inventory (an Engine runtime must never be embedded): "
              f"{sorted(map(str, packaged_files ^ expected_files))}"
          )

          launcher = extract_root / "usr/bin/pdf-markdown-studio"
          assert launcher.read_text(encoding="utf-8") == (
              '#!/bin/sh\nexec /opt/pdf-markdown-studio/pdf_markdown_studio "$@"\n'
          )
          assert os.access(launcher, os.X_OK)
          assert os.access(
              extract_root / "opt/pdf-markdown-studio/pdf_markdown_studio",
              os.X_OK,
          )
          assert (
              extract_root
              / "usr/share/icons/hicolor/512x512/apps/pdf-markdown-studio.png"
          ).stat().st_size > 0
          PY

          desktop-file-validate \
            "$extract_root/usr/share/applications/pdf-markdown-studio.desktop"
          sh -n "$extract_root/usr/bin/pdf-markdown-studio"

      - name: Upload Ubuntu .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdf-markdown-studio-ubuntu-x64-deb
          path: dist/pdf-markdown-studio-ubuntu-amd64.deb
          if-no-files-found: error

  publish_release:
    name: Publish Release
    if: ${{ always() && inputs.create_release == true && needs.build_linux.result == 'success' }}
    needs: build_linux
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout (for tag history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release metadata
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force

          tag_exists() {
            local t="$1"
            git tag -l | sed -E 's/^v//' | grep -Fxq "$t"
          }

          # Manual override, if provided.
          manual_tag="${{ inputs.release_tag }}"
          if [[ -n "$manual_tag" ]]; then
            release_tag="$manual_tag"
          else
            # Normalize existing tag space by stripping optional leading "v".
            stable_versions="$(git tag -l | sed -E 's/^v//' | grep -E '^[0-9]+\.[0-9]+$' | sort -u || true)"
            latest_stable="$(printf "%s\n" "$stable_versions" | sort -V | tail -n 1)"

            if [[ "${{ inputs.prerelease }}" == "true" ]]; then
              # Pre-release sequence:
              # - If latest stable is X.Y, pre-release line is X.(Y+1).Z
              # - If no stable exists yet, start at 1.0.0
              if [[ -n "$latest_stable" ]]; then
                IFS='.' read -r stable_major stable_minor <<< "$latest_stable"
                pre_major="$stable_major"
                pre_minor="$((stable_minor + 1))"
              else
                pre_major=1
                pre_minor=0
              fi

              pre_prefix="${pre_major}.${pre_minor}"
              pre_versions="$(git tag -l | sed -E 's/^v//' | grep -E "^${pre_major}\\.${pre_minor}\\.[0-9]+$" | sort -u || true)"
              latest_pre_patch="$(printf "%s\n" "$pre_versions" | sed -E 's/^.*\.([0-9]+)$/\1/' | sort -n | tail -n 1)"
              if [[ -n "$latest_pre_patch" ]]; then
                next_pre_patch="$((latest_pre_patch + 1))"
              else
                next_pre_patch=0
              fi
              release_tag="${pre_prefix}.${next_pre_patch}"

              # Guard against canonical/legacy duplicate tags (e.g. v1.3.0 vs 1.3.0).
              while tag_exists "$release_tag"; do
                next_pre_patch="$((next_pre_patch + 1))"
                release_tag="${pre_prefix}.${next_pre_patch}"
              done
            else
              # Stable release sequence: 1.0, 1.1, 1.2, ...
              if [[ -n "$latest_stable" ]]; then
                IFS='.' read -r stable_major stable_minor <<< "$latest_stable"
                next_minor="$((stable_minor + 1))"
                release_tag="${stable_major}.${next_minor}"
              else
                release_tag="1.0"
              fi

              # Guard against canonical/legacy duplicate tags (e.g. v1.0 vs 1.0).
              while tag_exists "$release_tag"; do
                IFS='.' read -r stable_major stable_minor <<< "$release_tag"
                release_tag="${stable_major}.$((stable_minor + 1))"
              done
            fi
          fi

          echo "RELEASE_TAG=$release_tag" >> "$GITHUB_ENV"

          if [[ -n "${{ inputs.release_name }}" ]]; then
            echo "RELEASE_NAME=${{ inputs.release_name }}" >> "$GITHUB_ENV"
          else
            echo "RELEASE_NAME=PDF Markdown Studio ${release_tag}" >> "$GITHUB_ENV"
          fi

      - name: Reuse Windows and macOS assets from an existing release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_SOURCE_TAG: ${{ inputs.non_linux_assets_release_tag }}
        run: |
          set -euo pipefail
          source_tag="${REQUESTED_SOURCE_TAG}"
          if [[ -z "${source_tag}" ]]; then
            source_tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name')"
          fi
          if [[ -z "${source_tag}" || "${source_tag}" == "null" ]]; then
            echo "No existing release is available for retained Windows/macOS assets." >&2
            exit 1
          fi
          if [[ "${source_tag}" == "${RELEASE_TAG}" ]]; then
            echo "The retained-asset source tag must differ from the new release tag (${RELEASE_TAG})." >&2
            exit 1
          fi

          mkdir -p release-assets/windows release-assets/macos
          gh release download "${source_tag}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "pdf-markdown-studio-windows-x64.exe" \
            --dir release-assets/windows
          gh release download "${source_tag}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "pdf-markdown-studio-macos-arm64.dmg" \
            --dir release-assets/macos
          {
            echo "NON_LINUX_ASSET_SOURCE_TAG=${source_tag}"
            echo "NON_LINUX_WINDOWS_SHA256=$(sha256sum release-assets/windows/pdf-markdown-studio-windows-x64.exe | awk '{print $1}')"
            echo "NON_LINUX_MACOS_SHA256=$(sha256sum release-assets/macos/pdf-markdown-studio-macos-arm64.dmg | awk '{print $1}')"
          } >> "$GITHUB_ENV"

      - name: Download Ubuntu .deb artifact
        uses: actions/download-artifact@v4
        with:
          name: pdf-markdown-studio-ubuntu-x64-deb
          path: release-assets/linux

      - name: Prepare release notes
        shell: bash
        run: |
          set -euo pipefail
          ls -lah release-assets/windows release-assets/macos release-assets/linux

          TAG="${RELEASE_TAG}"
          REPO="${GITHUB_REPOSITORY}"

          WIN_FILE="pdf-markdown-studio-windows-x64.exe"
          MAC_FILE="pdf-markdown-studio-macos-arm64.dmg"
          UBU_FILE="pdf-markdown-studio-ubuntu-amd64.deb"
          SUM_FILE="SHA256SUMS.txt"

          WIN_URL="https://github.com/${REPO}/releases/download/${TAG}/${WIN_FILE}"
          MAC_URL="https://github.com/${REPO}/releases/download/${TAG}/${MAC_FILE}"
          UBU_URL="https://github.com/${REPO}/releases/download/${TAG}/${UBU_FILE}"
          SUM_URL="https://github.com/${REPO}/releases/download/${TAG}/${SUM_FILE}"
          mkdir -p release-upload
          cp "release-assets/windows/${WIN_FILE}" "release-upload/${WIN_FILE}"
          cp "release-assets/macos/${MAC_FILE}" "release-upload/${MAC_FILE}"
          cp "release-assets/linux/${UBU_FILE}" "release-upload/${UBU_FILE}"
          sha256sum "release-upload/${WIN_FILE}" | sed 's|release-upload/||' > "${SUM_FILE}"
          sha256sum "release-upload/${MAC_FILE}" | sed 's|release-upload/||' >> "${SUM_FILE}"
          sha256sum "release-upload/${UBU_FILE}" | sed 's|release-upload/||' >> "${SUM_FILE}"

          cat > release-notes.md <<RELEASE_NOTES
          ## Downloads

          - Windows x64*: [pdf-markdown-studio-windows-x64](${WIN_URL})
          - macOS arm64: [${MAC_FILE}](${MAC_URL})
          - Ubuntu x64 (.deb): [${UBU_FILE}](${UBU_URL})
          - Checksums: [${SUM_FILE}](${SUM_URL})

          Windows and macOS binaries are carried forward unchanged from release ${NON_LINUX_ASSET_SOURCE_TAG}; this workflow builds only Linux.

          ## Unsigned Build Notice

          This app is an open-source hobby development effort by the repository owner. We do not currently have funding for full paid code-signing and notarization pipelines across all platforms/releases.

          Because of that, operating-system protections or hardened security environments (for example Windows SmartScreen, enterprise endpoint controls, or macOS Gatekeeper policies) may block unsigned binaries.

          If your environment blocks unsigned binaries, the recommended path is:

          - build this desktop app from source on the target device,
          - build Openresearchtools-Engine from source on the same target device,
          - and use those locally-built artifacts in your deployment.

          ### Windows (when blocked)

          - If SmartScreen shows "Windows protected your PC", use More info -> Run anyway only if your policy allows it.
          - In the app, go to Settings -> Runtime Setup and run:
            - Download/Repair runtime
            - Unblock unsigned runtime
            - Recheck
          - The Windows unblock script clears Mark-of-the-Web flags in the selected runtime directory by running Unblock-File recursively on runtime files.

          ### macOS (when blocked)

          - Try Right click -> Open on first launch.
          - If blocked by Gatekeeper, use System Settings -> Privacy & Security -> Open Anyway when available and policy permits.
          - In the app, after runtime install/repair, click Unblock unsigned runtime then Recheck.
          - The macOS unblock script removes quarantine attributes recursively (xattr -dr com.apple.quarantine) and restores executable bits for runtime binaries/scripts where needed (chmod +x on relevant files).
          
          ## Quick Install (Ubuntu)

          \`\`\`bash
          curl -L "${UBU_URL}" -o /tmp/${UBU_FILE} && sudo apt install -y /tmp/${UBU_FILE}
          \`\`\`
          RELEASE_NOTES

      - name: Verify retained assets are byte-for-byte preserved
        shell: bash
        run: |
          set -euo pipefail
          for asset in \
            pdf-markdown-studio-windows-x64.exe \
            pdf-markdown-studio-macos-arm64.dmg
          do
            case "$asset" in
              *.exe) source_path="release-assets/windows/$asset" ;;
              *.dmg) source_path="release-assets/macos/$asset" ;;
            esac
            upload_path="release-upload/$asset"
            cmp --silent "$source_path" "$upload_path" || {
              echo "Retained asset changed during release assembly: $asset" >&2
              exit 1
            }
            source_sha="$(sha256sum "$source_path" | awk '{print $1}')"
            upload_sha="$(sha256sum "$upload_path" | awk '{print $1}')"
            test "$source_sha" = "$upload_sha"
            case "$asset" in
              *.exe) test "$upload_sha" = "$NON_LINUX_WINDOWS_SHA256" ;;
              *.dmg) test "$upload_sha" = "$NON_LINUX_MACOS_SHA256" ;;
            esac
            echo "$asset preserved byte-for-byte: $source_sha"
          done

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: ${{ env.RELEASE_NAME }}
          prerelease: ${{ inputs.prerelease }}
          draft: ${{ inputs.draft }}
          body_path: release-notes.md
          generate_release_notes: false
          files: |
            release-upload/*
            SHA256SUMS.txt
